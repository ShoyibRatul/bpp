<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--tg-theme-bg-color, #f0f7f0);
      color: var(--tg-theme-text-color, #1a1a1a);
      transition: background 0.3s;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 20px;
      padding: 36px 28px 28px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }

    .flag { font-size: 52px; margin-bottom: 12px; line-height: 1; }

    h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--tg-theme-link-color, #006b3f);
      margin-bottom: 6px;
    }

    .sub {
      font-size: 13px;
      color: var(--tg-theme-hint-color, #777);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .captcha-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    #status {
      font-size: 14px;
      font-weight: 600;
      min-height: 22px;
      color: var(--tg-theme-link-color, #006b3f);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,107,63,0.2);
      border-top-color: #006b3f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: var(--tg-theme-hint-color, #aaa);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="flag">🇧🇩</div>
    <h1>e-Passport Status Check</h1>
    <p class="sub">
      Tap the checkbox below to verify.<br>
      Your passport status loads automatically.
    </p>

    <div class="captcha-wrap">
      <div class="h-captcha"
           data-sitekey="12baaa15-55cb-409a-bbbe-900132d52afa"
           data-callback="onSolved"
           data-error-callback="onError">
      </div>
    </div>

    <div id="status">
      <span id="msg">☝️ Click the checkbox above</span>
      <div class="spinner" id="spinner"></div>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function onSolved(token) {
      document.getElementById('msg').textContent = '✅ Verified! Sending to bot…';
      document.getElementById('spinner').style.display = 'block';
      tg.sendData(token);
    }

    function onError() {
      document.getElementById('msg').textContent = '❌ Error. Please try again.';
    }
  </script>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</body>
</html>
